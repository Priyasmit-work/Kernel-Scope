<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KernelScope</title>
    <style>
      :root {
        --bg: #0B1120;
        --sidebar: #101A2C;
        --card: #151F33;
        --elevated: #1C2940;
        --primary-blue: #3B82F6;
        --highlight-blue: #60A5FA;
        --cyan: #22D3EE;
        --success: #22C55E;
        --warning: #F59E0B;
        --critical: #EF4444;
        --text-primary: #F8FAFC;
        --text-secondary: #94A3B8;
        --sidebar-width: 240px;
        --toolbar-height: 64px;
        --content-padding: 24px;
        --card-radius: 12px;
        --spacing: 16px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; width: 100%; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text-primary); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
